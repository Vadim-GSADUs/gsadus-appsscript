<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      body { padding: 12px; font-family: 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
      
      /* Card Style Sections */
      .card { background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; }
      .card-header { font-weight: bold; margin-bottom: 8px; color: #333; display: flex; justify-content: space-between; align-items: center; }
      
      input[type="text"], select { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
      .hint { font-size: 11px; color: #666; margin-bottom: 5px; }
      
      button { width: 100%; padding: 8px; cursor: pointer; }
      button.primary { background: #1a73e8; color: white; border: none; font-weight: bold; }
      button.secondary { background: #f1f3f4; color: #333; border: 1px solid #ddd; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      .checklist-box { border: 1px solid #eee; max-height: 140px; overflow-y: auto; padding: 5px; background: #fafafa; }
      .check-item { display: flex; align-items: center; margin-bottom: 4px; font-size: 12px; }
      .check-item input { margin-right: 8px; }
      
      #status { font-size: 11px; color: #666; margin-top: 5px; text-align: center; }
    </style>
  </head>
  <body>

    <div style="text-align:center; margin-bottom:10px;">
      <h3 style="margin:0; color:#444;">GSADUs Control</h3>
    </div>
    
    <div class="card">
      <div class="card-header">1. Project Location</div>
      <input type="text" id="location-input" placeholder="Address OR Lat,Long">
      <div class="hint">Ex: "38.65, -121.30"</div>
      <button class="secondary" id="btn-map">Update Map Only</button>
    </div>

    <div class="card">
      <div class="card-header">2. ADU Model</div>
      <select id="model-select" onchange="loadImages()">
        <option value="" disabled selected>Choose a model...</option>
      </select>
      
      <div id="checklist-area" style="display:none;">
        <div class="hint" style="margin-top:5px;">Select Images to Place:</div>
        <div class="checklist-box" id="image-list"></div>
        <button class="primary" id="btn-images" style="margin-top:10px;" disabled>Update Model Images</button>
      </div>
    </div>

    <div id="status">Ready</div>
    <img id="measure-img" style="display:none;" />

    <script>
      // INIT
      window.onload = function() {
        google.script.run.withSuccessHandler(populateModelDropdown).getModelList();
      };

      function populateModelDropdown(models) {
        var select = document.getElementById('model-select');
        models.forEach(function(m) {
          var option = document.createElement("option");
          option.text = m;
          option.value = m;
          select.add(option);
        });
      }

      // --- SECTION 1: MAP HANDLER ---
      document.getElementById('btn-map').addEventListener('click', function() {
        var loc = document.getElementById('location-input').value;
        if(!loc) return alert("Please enter a location.");
        
        setLoading(this, true, "Updating Map...");
        google.script.run
          .withSuccessHandler(function(msg) {
             setLoading(document.getElementById('btn-map'), false, "Update Map Only");
             setStatus("Map Updated!", "green");
          })
          .updateMapOnly(loc);
      });

      // --- SECTION 2: MODEL HANDLER ---
      function loadImages() {
        var modelName = document.getElementById('model-select').value;
        document.getElementById('checklist-area').style.display = 'block';
        document.getElementById('image-list').innerHTML = "Loading...";
        
        google.script.run.withSuccessHandler(renderChecklist).getImagesForModel(modelName);
      }

      function renderChecklist(images) {
        var list = document.getElementById('image-list');
        list.innerHTML = "";
        
        if (images.length === 0) { list.innerHTML = "No images found."; return; }

        images.forEach(function(img) {
          var div = document.createElement("div");
          div.className = "check-item";
          var checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = img.id;
          checkbox.dataset.name = img.name; 
          checkbox.checked = img.isChecked; 
          
          div.appendChild(checkbox);
          div.appendChild(document.createTextNode(img.name));
          list.appendChild(div);
        });
        document.getElementById('btn-images').disabled = false;
      }

      document.getElementById('btn-images').addEventListener('click', function() {
        var btn = this;
        var checkedBoxes = document.querySelectorAll('#image-list input:checked');
        var queue = []; 
        checkedBoxes.forEach(function(box) { 
            queue.push({id: box.value, name: box.dataset.name}); 
        });

        if(queue.length === 0) return alert("Select at least one image.");

        setLoading(btn, true, "Processing...");
        setStatus("Preparing Slide...", "blue");

        // STEP 1: PREPARE (Clear old models, get layout)
        google.script.run
          .withSuccessHandler(function(layoutData) {
             processQueue(queue, layoutData, 0);
          })
          .prepareImageUpdate();
      });

      // IMAGE QUEUE PROCESSOR
      function processQueue(queue, layoutData, index) {
        if (index >= queue.length) {
          setLoading(document.getElementById('btn-images'), false, "Update Model Images");
          setStatus("Images Updated!", "green");
          return;
        }

        var item = queue[index];
        setStatus("Placing: " + item.name + "...", "blue");

        google.script.run.withSuccessHandler(function(base64) {
             measureImage(base64, function(w, h) {
                google.script.run.withSuccessHandler(function(nextY) {
                     layoutData.currentRightY = nextY;
                     processQueue(queue, layoutData, index + 1);
                  })
                  .placeMeasuredImage(item.id, w, h, layoutData, item.name, layoutData.currentRightY);
             });
          }).fetchImageBase64(item.id);
      }

      // UTILS
      function measureImage(base64, callback) {
        var img = document.getElementById('measure-img');
        img.onload = function() { callback(img.naturalWidth, img.naturalHeight); img.src = ""; };
        img.src = "data:image/png;base64," + base64;
      }

      function setLoading(btn, isLoading, text) {
        btn.disabled = isLoading;
        btn.innerText = text;
      }
      
      function setStatus(msg, color) {
        var s = document.getElementById('status');
        s.innerText = msg;
        s.style.color = color || '#666';
      }
    </script>
  </body>
</html>
